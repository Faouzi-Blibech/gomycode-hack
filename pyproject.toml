[project]
name = "s2c"
version = "0.1.0"
description = "Sketch or photo to parametric CAD"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.7",
  "openai>=1.40",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "gradio>=4.40",
  "cadquery>=2.4",
  "opencv-python-headless>=4.10",
  "numpy>=1.26",
  "pillow>=10",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
ai = [
  "torch>=2.4",
  "transformers>=4.44",
  "rembg[cpu]>=2.0.57",
  "scikit-image>=0.24",
  "trimesh>=4.4",
  "omegaconf>=2.3",
  "einops>=0.7",
  "imageio>=2.34",
  "gradio_client>=1.3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["s2c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: needs a CUDA GPU and the ai extra",
  "slicer: needs PrusaSlicer installed",
]

[tool.ruff]
line-length = 120
