name: sketch-to-cad

services:
  app:
    image: sketch-to-cad:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-tmp:/app/tmp
      - app-logs:/app/logs
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  app-tmp:
  app-logs:

