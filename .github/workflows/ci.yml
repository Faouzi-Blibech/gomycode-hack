# Web job intentionally omitted: web/ does not exist in this repo yet.
# Add it back once the frontend lands, per Task 19 brief.
name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
